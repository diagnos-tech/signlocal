[faq]
free_q = "É mesmo gratuito?"
free_a = "Sim, para todos, sem conta. A aplicação e a extensão são software livre (GPL-3.0-or-later); as bibliotecas para programadores são Apache-2.0, por isso qualquer site ou programa as pode usar."
safe_q = "Um site pode ver o meu PIN, as minhas chaves ou os meus outros certificados?"
safe_a = "Não. O PIN é introduzido na aplicação ou na janela do sistema, e a chave privada nunca sai do seu computador nem do seu token. O site recebe apenas o certificado que escolher e a assinatura que confirmar."
certificates_q = "Que certificados funcionam?"
certificates_a = "Qualquer certificado que o seu sistema operativo ou o controlador do seu token consiga usar: tokens USB, cartões inteligentes (como o Cartão de Cidadão) e, no Windows e no macOS, certificados instalados no computador a partir de um ficheiro .pfx ou .p12. Não há lista de modelos aprovados."
phone_q = "Funciona no telemóvel?"
phone_a = "Não. O signlocal funciona em computadores com Windows, macOS ou Linux, onde se ligam os tokens e os cartões inteligentes."
warnings_q = "Porque é que o Windows e o macOS avisam na instalação?"
warnings_a = "As versões de teste ainda não têm assinatura de código. A instalação automática evita o aviso; a [página de instalação](install) indica onde clicar se transferir os ficheiros por si e como verificar a impressão digital de cada um."
background_q = "Fica alguma coisa sempre a correr em segundo plano?"
background_a = "Não. O navegador só abre a aplicação quando um site pede uma assinatura, e a aplicação não abre nenhuma porta de rede."
formats_q = "Que formatos de assinatura suporta?"
formats_a = "O signlocal devolve uma assinatura em bruto e o certificado; o site constrói o formato de que precisa (PAdES, CAdES, XAdES ou JAdES), segundo as regras de qualquer país."
websites_q = "Um site precisa de fazer alguma coisa especial?"
websites_a = "Sim: o site adiciona às suas páginas a biblioteca gratuita do signlocal. Se um site lhe pediu que instalasse o signlocal, já o fez."

