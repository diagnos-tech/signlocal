[privacy]
title = "Privacidade"
lead = "O signlocal foi feito para saber o mínimo possível. Este site não tem rastreadores e o produto não exige conta."
h1 = "O que fica no seu computador"
t1 = "Os seus certificados, o PIN e as chaves nunca saem do computador. A aplicação pede ao sistema operativo ou ao controlador do token que assine."
h2 = "O que um site recebe"
t2 = "Apenas o que aprovar: o certificado público escolhido e a assinatura do hash que enviou. Nunca o PIN nem a chave privada."
h3 = "Permissões"
t3 = "Um site ou programa só é memorizado se marcar a caixa. A lista está na aplicação, com um botão Revogar."
h4 = "Registos"
t4 = "Os registos de diagnóstico não contêm nomes, números de identificação, números de série, digests, PINs nem conteúdo de certificados. Copiar o diagnóstico é uma escolha sua."
h5 = "Este site"
t5 = "Não tem cookies, análises, nem tipos de letra ou scripts externos. O idioma escolhido fica apenas no seu navegador."
t5_downloads = "Os botões de transferência levam a ficheiros no GitHub, onde o signlocal publica as versões."
h6 = "Contacto"
t6 = "Perguntas ou problemas a comunicar: abra uma issue no [repositório do código-fonte](issues)."

