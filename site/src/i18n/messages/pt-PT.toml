app_missing_a = "Instale a aplicação, se ainda não o fez. Se já está instalada, abra a página [Conclua a configuração](activate) e clique no botão: a aplicação volta a ligar-se aos seus navegadores."
token_q = "O meu token ou cartão não aparece"
token_a = "Ligue o token (ou introduza o cartão no leitor) e instale o software do fabricante, o controlador. Depois abra o **signlocal** e veja o separador **Dispositivos**: indica o que falta. No Linux, o serviço de cartões tem de estar em execução: `sudo systemctl enable --now pcscd.socket`. Veja os [modelos que conhecemos](compatibility#devices)."
firefox_restart_q = "O Firefox esqueceu-se da extensão após reiniciar"
firefox_restart_a = "Até o signlocal estar nos Extras do Firefox, o Firefox só o carrega até ser fechado. Carregue-o novamente em **about:debugging** ou use o Chrome, o Edge, o Brave ou o Opera, que mantêm a extensão."
safari_restart_q = "O Safari deixou de encontrar a extensão após reiniciar"
safari_restart_a = "O Safari desativa **Permitir extensões não assinadas** sempre que é encerrado. Ative-o novamente em **Definições → Programador**; a extensão continua assinalada."
smartscreen_q = "O Windows diz “O Windows protegeu o seu PC”"
smartscreen_a = "As versões de teste ainda não têm assinatura de código. Clique em **Mais informações** e depois em **Executar mesmo assim**. A instalação automática evita esta mensagem."
gatekeeper_q = "O macOS diz que a aplicação não pode ser aberta"
gatekeeper_a = "As versões de teste ainda não são notarizadas pela Apple. Abra **Definições do Sistema → Privacidade e segurança** e clique em **Abrir mesmo assim**. A instalação automática evita esta mensagem."
pin_locked_q = "O meu PIN está bloqueado"
pin_locked_a = "Depois de demasiados PINs errados, o token ou o cartão bloqueia-se. Desbloqueie-o com o PUK, usando o software do fabricante ou da entidade que emitiu o seu certificado. O signlocal não o consegue desbloquear."
uninstall_q = "Como desinstalo o signlocal?"
uninstall_windows = "**Windows**: execute o instalador novamente com `-Uninstall`, ou apague `%LOCALAPPDATA%\\Programs\\signlocal` depois de executar `signlocal uninstall`."
uninstall_macos = "**macOS**: execute `signlocal uninstall` e depois mova o **signlocal** de Aplicações para a Reciclagem."
uninstall_linux = "**Linux**: `sudo apt remove signlocal` ou `sudo dnf remove signlocal`; se usou o script de instalação, `sh install.sh --uninstall`."
uninstall_extension = "Depois, remova a extensão na página de extensões do navegador."
