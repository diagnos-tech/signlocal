test_description = "Check that the signlocal extension, the app and your certificate work together. Nothing is sent anywhere."
activate_title = "Finish setting up · signlocal"
activate_description = "Connect the signlocal app to your browsers."
privacy_title = "Privacy · signlocal"
privacy_description = "What stays on your computer, what a website receives, and what this website does not do."
compatibility_title = "Compatibility · signlocal"
compatibility_description = "Systems, browsers, certificates, tokens and cards that work with signlocal."
help_title = "Help · signlocal"
help_description = "Fix common problems with the extension, the app, tokens and cards, and uninstall signlocal."

