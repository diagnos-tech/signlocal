[faq]
free_q = "Is it really free?"
free_a = "Yes, for everyone, with no account. The app and the extension are free software (GPL-3.0-or-later); the libraries for developers are Apache-2.0, so any website or program can use them."
safe_q = "Can a website see my PIN, my keys or my other certificates?"
safe_a = "No. The PIN is typed in the app or the system window, and the private key never leaves your computer or your token. A website only receives the certificate you choose and the signature you confirm."
certificates_q = "Which certificates work?"
certificates_a = "Any certificate your operating system or your token's driver can use: USB tokens, smart cards and, on Windows and macOS, certificates installed on the computer from a .pfx or .p12 file. There is no list of approved models."
phone_q = "Does it work on phones?"
phone_a = "No. signlocal runs on computers with Windows, macOS or Linux, where tokens and smart cards are plugged in."
warnings_q = "Why do Windows and macOS warn when I install it?"
warnings_a = "Preview versions are not code-signed yet. The automatic install avoids the warning; the [install page](install) says what to click if you download the files yourself, and how to check each file's fingerprint."
background_q = "Is something always running in the background?"
background_a = "No. The browser starts the app only when a website asks for a signature, and the app opens no network port."
formats_q = "Which signature formats does it support?"
formats_a = "signlocal returns a raw signature and the certificate; the website builds the format it needs (PAdES, CAdES, XAdES or JAdES), for any country's rules."
websites_q = "Does a website need to do anything special?"
websites_a = "Yes: the website adds signlocal's free library to its pages. If a website asked you to install signlocal, it already did."

