[help]
title = "Help"
lead = "Fixes for the most common problems, how to uninstall, and how to get help."
toc_label = "Topics"
extension_missing_q = "The test page says the extension is not installed"
extension_missing_a = "Add the extension to the browser where you sign, then reload the page. In Firefox, add it again after each restart until it is on Firefox Add-ons."
extension_missing_action = "Add the extension"
app_missing_q = "The extension can't find the app"
app_missing_a = "Install the app if you haven't yet. If it is installed, open the [Finish setting up](activate) page and press the button: the app connects itself to your browsers again."
token_q = "My token or card doesn't show up"
token_a = "Plug the token in (or insert the card in the reader) and install its maker's software, the driver. Then open **signlocal** and check the **Devices** tab: it says what is missing. On Linux, the card service must be running: `sudo systemctl enable --now pcscd.socket`. See the [models we know](compatibility#devices)."
firefox_restart_q = "Firefox forgot the extension after restarting"
firefox_restart_a = "Until signlocal is on Firefox Add-ons, Firefox loads it only until it closes. Load it again from **about:debugging**, or use Chrome, Edge, Brave or Opera, which keep it."
safari_restart_q = "Safari stopped finding the extension after restarting"
safari_restart_a = "Safari turns **Allow unsigned extensions** off every time it quits. Turn it on again in **Settings → Developer**; the extension stays ticked."
smartscreen_q = "Windows says “Windows protected your PC”"
smartscreen_a = "Preview versions aren't code-signed yet. Click **More info**, then **Run anyway**. The automatic install avoids this message."
gatekeeper_q = "macOS says the app can't be opened"
gatekeeper_a = "Preview versions aren't notarized yet. Open **System Settings → Privacy & Security** and click **Open Anyway**. The automatic install avoids this message."
pin_locked_q = "My PIN is locked"
pin_locked_a = "After too many wrong PINs the token or card locks itself. Unlock it with the PUK, using the software from its maker or the company that issued your certificate. signlocal cannot unlock it."
uninstall_q = "How do I uninstall signlocal?"
uninstall_windows = "**Windows**: run the installer again with `-Uninstall`, or delete `%LOCALAPPDATA%\\Programs\\signlocal` after running `signlocal uninstall`."
uninstall_macos = "**macOS**: run `signlocal uninstall`, then move **signlocal** from Applications to the Trash."
uninstall_linux = "**Linux**: `sudo apt remove signlocal` or `sudo dnf remove signlocal`; for the installer script, `sh install.sh --uninstall`."
uninstall_extension = "Then remove the extension from your browser's extensions page."
support_q = "I still need help"
support_a = "Open **signlocal** and choose **Copy diagnostics**: the text contains no names, ID numbers or PINs. Then [open an issue](issues) and paste it."
faq_title = "Questions"
