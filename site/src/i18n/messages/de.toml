token_q = "Mein Token oder meine Chipkarte erscheint nicht"
token_a = "Stecken Sie den Token an (oder legen Sie die Chipkarte in den Kartenleser ein) und installieren Sie die Software des Herstellers, den Treiber. Öffnen Sie dann **signlocal** und sehen Sie auf dem Tab **Geräte** nach: Dort steht, was fehlt. Unter Linux muss der Chipkartendienst laufen: `sudo systemctl enable --now pcscd.socket`. Siehe die [Modelle, die wir kennen](compatibility#devices)."
firefox_restart_q = "Firefox hat die Erweiterung nach dem Neustart vergessen"
firefox_restart_a = "Solange signlocal nicht auf Firefox Add-ons ist, lädt Firefox es nur, bis es geschlossen wird. Laden Sie es erneut über **about:debugging** oder verwenden Sie Chrome, Edge, Brave oder Opera, die es behalten."
safari_restart_q = "Safari findet die Erweiterung nach dem Neustart nicht mehr"
safari_restart_a = "Safari schaltet **Nicht signierte Erweiterungen erlauben** bei jedem Beenden aus. Schalten Sie es unter **Einstellungen → Entwickler** wieder ein; die Erweiterung bleibt angehakt."
smartscreen_q = "Windows meldet „Der Computer wurde durch Windows geschützt“"
smartscreen_a = "Vorabversionen sind noch nicht codesigniert. Klicken Sie auf **Weitere Informationen** und dann auf **Trotzdem ausführen**. Die automatische Installation vermeidet diese Meldung."
gatekeeper_q = "macOS meldet, dass die App nicht geöffnet werden kann"
gatekeeper_a = "Vorabversionen sind noch nicht notarisiert. Öffnen Sie **Systemeinstellungen → Datenschutz & Sicherheit** und klicken Sie auf **Dennoch öffnen**. Die automatische Installation vermeidet diese Meldung."
pin_locked_q = "Meine PIN ist gesperrt"
pin_locked_a = "Nach zu vielen falschen PIN-Eingaben sperren sich Token und Chipkarte von selbst. Entsperren Sie sie mit der PUK und der Software des Herstellers oder des Unternehmens, das Ihr Zertifikat ausgestellt hat. signlocal kann sie nicht entsperren."
uninstall_q = "Wie deinstalliere ich signlocal?"
uninstall_windows = "**Windows**: Führen Sie das Installationsprogramm erneut mit `-Uninstall` aus oder löschen Sie `%LOCALAPPDATA%\\Programs\\signlocal`, nachdem Sie `signlocal uninstall` ausgeführt haben."
uninstall_macos = "**macOS**: Führen Sie `signlocal uninstall` aus und ziehen Sie dann **signlocal** aus dem Ordner „Programme“ in den Papierkorb."
uninstall_linux = "**Linux**: `sudo apt remove signlocal` oder `sudo dnf remove signlocal`; beim Installationsskript `sh install.sh --uninstall`."
uninstall_extension = "Entfernen Sie danach die Erweiterung auf der Erweiterungsseite Ihres Browsers."
support_q = "Ich brauche weiterhin Hilfe"
