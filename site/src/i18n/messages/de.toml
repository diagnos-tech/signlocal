[faq]
free_q = "Ist es wirklich kostenlos?"
free_a = "Ja, für alle und ohne Konto. App und Erweiterung sind freie Software (GPL-3.0-or-later); die Bibliotheken für Entwickler stehen unter Apache-2.0, sodass jede Website und jedes Programm sie nutzen kann."
safe_q = "Kann eine Website meine PIN, meine Schlüssel oder meine anderen Zertifikate sehen?"
safe_a = "Nein. Die PIN geben Sie in der App oder im Systemfenster ein, und der private Schlüssel verlässt nie Ihren Computer oder Ihren Token. Die Website erhält nur das Zertifikat, das Sie wählen, und die Signatur, die Sie bestätigen."
certificates_q = "Welche Zertifikate funktionieren?"
certificates_a = "Jedes Zertifikat, das Ihr Betriebssystem oder der Treiber Ihres Tokens nutzen kann: USB-Tokens, Chipkarten und, unter Windows und macOS, auf dem Computer installierte Zertifikate aus einer .pfx- oder .p12-Datei. Es gibt keine Liste zugelassener Modelle."
phone_q = "Funktioniert es auf dem Smartphone?"
phone_a = "Nein. signlocal läuft auf Computern mit Windows, macOS oder Linux, an denen Tokens und Chipkarten angeschlossen werden."
warnings_q = "Warum warnen Windows und macOS bei der Installation?"
warnings_a = "Vorabversionen sind noch nicht codesigniert. Die automatische Installation vermeidet die Warnung; die [Installationsseite](install) zeigt, wo Sie klicken müssen, wenn Sie die Dateien selbst herunterladen, und wie Sie den Fingerabdruck jeder Datei prüfen."
background_q = "Läuft ständig etwas im Hintergrund?"
background_a = "Nein. Der Browser startet die App nur, wenn eine Website eine Signatur anfordert, und die App öffnet keinen Netzwerkport."
formats_q = "Welche Signaturformate werden unterstützt?"
formats_a = "signlocal liefert eine Rohsignatur und das Zertifikat; die Website erstellt das Format, das sie braucht (PAdES, CAdES, XAdES oder JAdES), nach den Regeln jedes Landes."
websites_q = "Muss eine Website etwas Besonderes tun?"
websites_a = "Ja: Die Website bindet die kostenlose Bibliothek von signlocal in ihre Seiten ein. Hat eine Website Sie gebeten, signlocal zu installieren, hat sie das bereits getan."

