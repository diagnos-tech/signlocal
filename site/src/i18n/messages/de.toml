[privacy]
title = "Datenschutz"
lead = "signlocal ist so gebaut, dass es möglichst wenig weiß. Diese Website hat keine Tracker, und das Produkt braucht kein Konto."
h1 = "Was auf Ihrem Computer bleibt"
t1 = "Ihre Zertifikate, Ihre PIN und die Schlüssel verlassen den Computer nie. Die App bittet das Betriebssystem oder den Token-Treiber zu signieren."
h2 = "Was eine Website erhält"
t2 = "Nur, was Sie genehmigen: das gewählte öffentliche Zertifikat und die Signatur des gesendeten Hashs. Nie die PIN und nie den privaten Schlüssel."
h3 = "Berechtigungen"
t3 = "Eine Website oder ein Programm wird nur gemerkt, wenn Sie das Kästchen anhaken. Die Liste steht in der App, mit einer Schaltfläche Widerrufen."
h4 = "Protokolle"
t4 = "Diagnoseprotokolle enthalten keine Namen, Ausweisnummern, Seriennummern, Digests, PINs oder Zertifikatsinhalte. Das Kopieren der Diagnose ist Ihre Entscheidung."
h5 = "Diese Website"
t5 = "Sie hat keine Cookies, keine Analyse und keine externen Schriften oder Skripte. Die gewählte Sprache wird nur in Ihrem Browser gespeichert."
t5_downloads = "Download-Schaltflächen führen zu Dateien auf GitHub, wo signlocal seine Versionen veröffentlicht."
h6 = "Kontakt"
t6 = "Fragen oder Meldungen: Eröffnen Sie ein Issue im [Quellcode-Repository](issues)."

