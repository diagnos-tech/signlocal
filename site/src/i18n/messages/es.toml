[help]
title = "Ayuda"
lead = "Soluciones a los problemas más comunes, cómo desinstalar y cómo obtener ayuda."
toc_label = "Temas"
extension_missing_q = "La página de prueba dice que la extensión no está instalada"
extension_missing_a = "Añada la extensión al navegador en el que firma y vuelva a cargar la página. En Firefox, vuelva a añadirla después de cada reinicio hasta que esté en los complementos de Firefox."
extension_missing_action = "Añadir la extensión"
app_missing_q = "La extensión no encuentra la aplicación"
app_missing_a = "Instale la aplicación si aún no lo hizo. Si ya está instalada, abra la página [Termine la configuración](activate) y pulse el botón: la aplicación se vuelve a conectar a sus navegadores."
token_q = "Mi token o tarjeta no aparece"
token_a = "Conecte el token (o inserte la tarjeta en el lector) e instale el software de su fabricante, el controlador. Después abra **signlocal** y revise la pestaña **Dispositivos**: indica qué falta. En Linux, el servicio de tarjetas debe estar activo: `sudo systemctl enable --now pcscd.socket`. Vea los [modelos que conocemos](compatibility#devices)."
firefox_restart_q = "Firefox olvidó la extensión después de reiniciar"
firefox_restart_a = "Hasta que signlocal esté en los complementos de Firefox, Firefox solo lo carga hasta que se cierra. Cárguelo de nuevo desde **about:debugging** o use Chrome, Edge, Brave u Opera, que lo conservan."
safari_restart_q = "Safari dejó de encontrar la extensión después de reiniciar"
safari_restart_a = "Safari desactiva **Permitir extensiones sin firmar** (Allow unsigned extensions) cada vez que se cierra. Vuelva a activarlo en **Ajustes → Desarrollador** (Settings → Developer); la extensión sigue marcada."
smartscreen_q = "Windows dice «Windows protegió su PC»"
smartscreen_a = "Las versiones de prueba aún no tienen firma de código. Haga clic en **Más información** (More info) y después en **Ejecutar de todas formas** (Run anyway). La instalación automática evita este mensaje."
gatekeeper_q = "macOS dice que no se puede abrir la aplicación"
gatekeeper_a = "Las versiones de prueba aún no están notarizadas. Abra **Ajustes del Sistema → Privacidad y seguridad** (System Settings → Privacy & Security) y haga clic en **Abrir igualmente** (Open Anyway). La instalación automática evita este mensaje."
pin_locked_q = "Mi PIN está bloqueado"
pin_locked_a = "Tras demasiados PIN incorrectos, el token o la tarjeta se bloquea. Desbloquéelo con el PUK, usando el software de su fabricante o de la entidad que emitió su certificado. signlocal no puede desbloquearlo."
uninstall_q = "¿Cómo desinstalo signlocal?"
uninstall_windows = "**Windows**: ejecute de nuevo el instalador con `-Uninstall`, o borre `%LOCALAPPDATA%\\Programs\\signlocal` después de ejecutar `signlocal uninstall`."
uninstall_macos = "**macOS**: ejecute `signlocal uninstall` y después mueva **signlocal** de Aplicaciones a la Papelera."
uninstall_linux = "**Linux**: `sudo apt remove signlocal` o `sudo dnf remove signlocal`; con el script de instalación, `sh install.sh --uninstall`."
uninstall_extension = "Después quite la extensión en la página de extensiones de su navegador."
support_q = "Sigo necesitando ayuda"
support_a = "Abra **signlocal** y elija **Copiar diagnóstico**: el texto no contiene nombres, números de documento ni PIN. Después [abra una issue](issues) y péguelo."
faq_title = "Preguntas"
