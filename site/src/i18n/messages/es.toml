[faq]
free_q = "¿De verdad es gratis?"
free_a = "Sí, para todos y sin cuenta. La aplicación y la extensión son software libre (GPL-3.0-or-later); las bibliotecas para desarrolladores son Apache-2.0, así que cualquier sitio web o programa puede usarlas."
safe_q = "¿Puede un sitio web ver mi PIN, mis claves o mis otros certificados?"
safe_a = "No. El PIN se escribe en la aplicación o en la ventana del sistema, y la clave privada nunca sale de su equipo ni de su token. El sitio solo recibe el certificado que usted elige y la firma que confirma."
certificates_q = "¿Qué certificados funcionan?"
certificates_a = "Cualquier certificado que su sistema operativo o el controlador de su token pueda usar: tokens USB, tarjetas inteligentes y, en Windows y macOS, certificados instalados en el equipo a partir de un archivo .pfx o .p12. No hay una lista de modelos aprobados."
phone_q = "¿Funciona en el móvil?"
phone_a = "No. signlocal funciona en equipos con Windows, macOS o Linux, donde se conectan los tokens y las tarjetas inteligentes."
warnings_q = "¿Por qué Windows y macOS avisan al instalarlo?"
warnings_a = "Las versiones de prueba aún no tienen firma de código. La instalación automática evita el aviso; la [página de instalación](install) indica dónde hacer clic si descarga los archivos usted mismo y cómo comprobar la huella digital de cada archivo."
background_q = "¿Hay algo siempre ejecutándose en segundo plano?"
background_a = "No. El navegador solo abre la aplicación cuando un sitio web pide una firma, y la aplicación no abre ningún puerto de red."
formats_q = "¿Qué formatos de firma admite?"
formats_a = "signlocal devuelve una firma en bruto y el certificado; el sitio web construye el formato que necesita (PAdES, CAdES, XAdES o JAdES), según las normas de cualquier país."
websites_q = "¿Un sitio web tiene que hacer algo especial?"
websites_a = "Sí: el sitio web añade la biblioteca gratuita de signlocal a sus páginas. Si un sitio web le pidió instalar signlocal, ya lo hizo."

