[privacy]
title = "Privacidad"
lead = "signlocal está hecho para saber lo mínimo posible. Este sitio no tiene rastreadores y el producto no requiere cuenta."
h1 = "Lo que se queda en su equipo"
t1 = "Sus certificados, su PIN y las claves nunca salen del equipo. La aplicación pide al sistema operativo o al controlador del token que firme."
h2 = "Lo que recibe un sitio"
t2 = "Solo lo que usted aprueba: el certificado público elegido y la firma del hash que envió. Nunca el PIN ni la clave privada."
h3 = "Permisos"
t3 = "Un sitio o programa solo se recuerda si marca la casilla. La lista está en la aplicación, con un botón Revocar."
h4 = "Registros"
t4 = "Los registros de diagnóstico no contienen nombres, números de documento, números de serie, digests, PIN ni el contenido de certificados. Copiar el diagnóstico es decisión suya."
h5 = "Este sitio web"
t5 = "No tiene cookies, analítica, ni fuentes o scripts externos. El idioma elegido se guarda solo en su navegador."
t5_downloads = "Los botones de descarga llevan a archivos en GitHub, donde signlocal publica sus versiones."
h6 = "Contacto"
t6 = "Preguntas o avisos: abra una issue en el [repositorio del código fuente](issues)."

