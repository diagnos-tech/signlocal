title = "Ajuda"
lead = "Soluções para os problemas mais comuns, como desinstalar e como pedir ajuda."
toc_label = "Tópicos"
extension_missing_q = "A página de teste diz que a extensão não está instalada"
extension_missing_a = "Adicione a extensão ao navegador em que você assina e recarregue a página. No Firefox, adicione de novo depois de cada reinício, até ela estar nos complementos do Firefox."
