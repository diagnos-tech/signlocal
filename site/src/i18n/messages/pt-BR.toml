[privacy]
title = "Privacidade"
lead = "O signlocal foi feito para saber o mínimo possível. Este site não tem rastreadores e o produto não exige cadastro."
h1 = "O que fica no seu computador"
t1 = "Seus certificados, seu PIN e as chaves nunca saem do computador. O app pede ao sistema operacional ou ao driver do token que assine."
h2 = "O que um site recebe"
t2 = "Só o que você aprova: o certificado público escolhido e a assinatura do hash que ele enviou. Nunca o PIN nem a chave privada."
h3 = "Permissões"
t3 = "Um site ou programa só é lembrado se você marcar a caixa. A lista fica no app, com um botão Revogar."
h4 = "Registros"
t4 = "Os registros de diagnóstico não têm nomes, CPF/CNPJ, números de série, digests, PINs nem conteúdo de certificados. Copiar o diagnóstico é escolha sua."
h5 = "Este site"
t5 = "Não tem cookies, análises, nem fontes ou scripts externos. O idioma escolhido fica só no seu navegador."
t5_downloads = "Os botões de download levam a arquivos no GitHub, onde o signlocal publica as versões."
h6 = "Contato"
t6 = "Dúvidas ou relatos: abra uma issue no [repositório do código-fonte](issues)."

