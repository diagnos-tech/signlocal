[faq]
free_q = "É mesmo gratuito?"
free_a = "Sim, para todos, sem cadastro. O app e a extensão são software livre (GPL-3.0-or-later); as bibliotecas para desenvolvedores são Apache-2.0, então qualquer site ou programa pode usá-las."
safe_q = "Um site pode ver meu PIN, minhas chaves ou meus outros certificados?"
safe_a = "Não. O PIN é digitado no app ou na janela do sistema, e a chave privada nunca sai do seu computador nem do seu token. O site recebe só o certificado que você escolhe e a assinatura que você confirma."
certificates_q = "Quais certificados funcionam?"
certificates_a = "Qualquer certificado que o seu sistema operacional ou o driver do seu token consiga usar: tokens USB e cartões (certificado A3) e, no Windows e no macOS, certificados instalados no computador a partir de um arquivo .pfx ou .p12 (certificado A1). Não há lista de modelos aprovados."
phone_q = "Funciona no celular?"
phone_a = "Não. O signlocal funciona em computadores com Windows, macOS ou Linux, onde tokens e cartões são conectados."
warnings_q = "Por que o Windows e o macOS avisam na instalação?"
warnings_a = "As versões de teste ainda não têm assinatura de código. A instalação automática evita o aviso; a [página de instalação](install) diz onde clicar se você baixar os arquivos por conta própria, e como conferir a impressão digital de cada arquivo."
background_q = "Fica algo sempre rodando em segundo plano?"
background_a = "Não. O navegador só abre o app quando um site pede uma assinatura, e o app não abre nenhuma porta de rede."
formats_q = "Quais formatos de assinatura são suportados?"
formats_a = "O signlocal devolve uma assinatura bruta e o certificado; o site monta o formato de que precisa (PAdES, CAdES, XAdES ou JAdES), seguindo as regras de qualquer país."
websites_q = "O site precisa fazer algo especial?"
websites_a = "Sim: o site adiciona às páginas dele a biblioteca gratuita do signlocal. Se um site pediu que você instalasse o signlocal, ele já fez isso."

