app_missing_q = "A extensão não encontra o app"
app_missing_a = "Instale o app, se ainda não instalou. Se ele já está instalado, abra a página [Conclua a configuração](activate) e clique no botão: o app se conecta de novo aos seus navegadores."
token_q = "O meu token ou cartão não aparece"
token_a = "Conecte o token (ou insira o cartão no leitor) e instale o programa do fabricante, o driver. Depois abra o **signlocal** e veja a aba **Dispositivos**: ela diz o que está faltando. No Linux, o serviço de cartões precisa estar ativo: `sudo systemctl enable --now pcscd.socket`. Veja os [modelos que conhecemos](compatibility#devices)."
firefox_restart_q = "O Firefox esqueceu a extensão depois de reiniciar"
firefox_restart_a = "Até o signlocal estar nos complementos do Firefox, o Firefox só o carrega até ser fechado. Carregue de novo em **about:debugging** ou use Chrome, Edge, Brave ou Opera, que mantêm a extensão."
safari_restart_q = "O Safari deixou de encontrar a extensão depois de reiniciar"
safari_restart_a = "O Safari desativa **Permitir Extensões Não Assinadas** toda vez que é encerrado. Ative de novo em **Ajustes → Desenvolvedor**; a extensão continua marcada."
smartscreen_q = "O Windows diz “O Windows protegeu o computador”"
smartscreen_a = "As versões de teste ainda não têm assinatura de código. Clique em **Mais informações** e depois em **Executar assim mesmo**. A instalação automática evita esta mensagem."
gatekeeper_q = "O macOS diz que o app não pode ser aberto"
gatekeeper_a = "As versões de teste ainda não são notarizadas pela Apple. Abra **Ajustes do Sistema → Privacidade e Segurança** e clique em **Abrir Mesmo Assim**. A instalação automática evita esta mensagem."
pin_locked_q = "O meu PIN está bloqueado"
pin_locked_a = "Depois de muitos PINs errados, o token ou cartão se bloqueia. Desbloqueie com o PUK, usando o programa do fabricante ou da empresa que emitiu o seu certificado. O signlocal não consegue desbloqueá-lo."
uninstall_q = "Como desinstalo o signlocal?"
uninstall_windows = "**Windows**: rode o instalador de novo com `-Uninstall`, ou apague `%LOCALAPPDATA%\\Programs\\signlocal` depois de rodar `signlocal uninstall`."
uninstall_macos = "**macOS**: rode `signlocal uninstall` e depois mova o **signlocal** de Aplicativos para o Lixo."
uninstall_linux = "**Linux**: `sudo apt remove signlocal` ou `sudo dnf remove signlocal`; se usou o script de instalação, `sh install.sh --uninstall`."
uninstall_extension = "Depois remova a extensão na página de extensões do navegador."
support_q = "Ainda preciso de ajuda"
