test_description = "Controlla che l’estensione di signlocal, l’app e il tuo certificato funzionino insieme. Non viene inviato nulla, da nessuna parte."
activate_title = "Completa la configurazione · signlocal"
activate_description = "Collega l’app signlocal ai tuoi browser."
privacy_title = "Privacy · signlocal"
privacy_description = "Cosa resta sul tuo computer, cosa riceve un sito e cosa non fa questo sito web."
compatibility_title = "Compatibilità · signlocal"
compatibility_description = "Sistemi, browser, certificati, token e smart card che funzionano con signlocal."
