token_a = "Collega il token (o inserisci la smart card nel lettore) e installa il software del produttore, il driver. Poi apri **signlocal** e guarda la scheda **Dispositivi**: dice cosa manca. Su Linux, il servizio smart card deve essere attivo: `sudo systemctl enable --now pcscd.socket`. Vedi i [modelli che conosciamo](compatibility#devices)."
