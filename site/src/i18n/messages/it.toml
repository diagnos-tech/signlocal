firefox_restart_a = "Finché signlocal non sarà tra i componenti aggiuntivi di Firefox, Firefox lo carica solo fino alla chiusura. Caricalo di nuovo da **about:debugging** oppure usa Chrome, Edge, Brave o Opera, che lo mantengono."
safari_restart_q = "Safari non trova più l’estensione dopo il riavvio"
safari_restart_a = "Safari disattiva **Consenti estensioni non firmate** ogni volta che viene chiuso. Riattivalo in **Impostazioni → Sviluppatore**; l’estensione resta selezionata."
smartscreen_q = "Windows dice “Windows ha protetto il PC”"
smartscreen_a = "Le versioni di anteprima non hanno ancora la firma del codice. Fai clic su **Ulteriori informazioni** e poi su **Esegui comunque**. L’installazione automatica evita questo messaggio."
gatekeeper_q = "macOS dice che l’app non può essere aperta"
gatekeeper_a = "Le versioni di anteprima non sono ancora notarizzate da Apple. Apri **Impostazioni di Sistema → Privacy e sicurezza** e fai clic su **Apri comunque**. L’installazione automatica evita questo messaggio."
pin_locked_q = "Il mio PIN è bloccato"
pin_locked_a = "Dopo troppi PIN errati il token o la smart card si blocca. Sbloccalo con il PUK, usando il software del produttore o dell’azienda che ha emesso il tuo certificato. signlocal non può sbloccarlo."
uninstall_q = "Come disinstallo signlocal?"
