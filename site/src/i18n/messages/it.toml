# signlocal website: Italian. Copy to site/src/i18n/messages/it.toml.
#
# Format: docs/architecture/i18n.md (dotted keys, {placeholders}, translator
# notes as comments above a key). No plurals on the site.
# Rich text (site/src/i18n/rich.ts): **bold**, `code`, __ink underline__ (hero
# only) and [label](page-id) links. Page ids: home, install, test, activate,
# privacy, compatibility, help, developers, releases, repository, issues,
# security. Keep markers and page ids unchanged in every language.
# The brand is "signlocal", always lowercase, never translated.
# Placeholders {os} and {browser} are product names (Windows, Chrome…) or,
# for "another Chromium-based browser", the text of browser.name_chromium.

[meta]
home_title = "signlocal: firma su qualsiasi sito con token, smart card o certificato"
home_description = "Usa il tuo token USB, la smart card o il certificato installato sul computer per firmare su qualsiasi sito. Gratuito e open source, per Windows, macOS e Linux."
install_title = "Installa signlocal"
install_description = "Rispondi a tre domande veloci e ricevi i passaggi esatti per installare signlocal con il tuo sistema, il tuo browser e il tuo certificato."
