[faq]
free_q = "È davvero gratuito?"
free_a = "Sì, per tutti e senza account. L’app e l’estensione sono software libero (GPL-3.0-or-later); le librerie per sviluppatori sono Apache-2.0, quindi qualsiasi sito o programma può usarle."
safe_q = "Un sito può vedere il mio PIN, le mie chiavi o gli altri miei certificati?"
safe_a = "No. Il PIN si digita nell’app o nella finestra del sistema, e la chiave privata non lascia mai il tuo computer né il tuo token. Il sito riceve solo il certificato che scegli e la firma che confermi."
certificates_q = "Quali certificati funzionano?"
certificates_a = "Qualsiasi certificato che il tuo sistema operativo o il driver del tuo token sa usare: token USB, smart card e, su Windows e macOS, certificati installati sul computer da un file .pfx o .p12. Non c’è un elenco di modelli approvati."
phone_q = "Funziona sul telefono?"
phone_a = "No. signlocal funziona sui computer con Windows, macOS o Linux, dove si collegano token e smart card."
warnings_q = "Perché Windows e macOS avvisano durante l’installazione?"
warnings_a = "Le versioni di anteprima non hanno ancora la firma del codice. L’installazione automatica evita l’avviso; la [pagina di installazione](install) spiega dove fare clic se scarichi i file a mano e come controllare l’impronta di ogni file."
background_q = "C’è qualcosa sempre in esecuzione in background?"
background_a = "No. Il browser avvia l’app solo quando un sito chiede una firma, e l’app non apre nessuna porta di rete."
formats_q = "Quali formati di firma supporta?"
formats_a = "signlocal restituisce una firma grezza e il certificato; il sito costruisce il formato che gli serve (PAdES, CAdES, XAdES o JAdES), secondo le regole di qualsiasi paese."
websites_q = "Il sito deve fare qualcosa di particolare?"
websites_a = "Sì: il sito aggiunge alle sue pagine la libreria gratuita di signlocal. Se un sito ti ha chiesto di installare signlocal, l’ha già fatto."

