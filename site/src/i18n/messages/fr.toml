[faq]
free_q = "Est-ce vraiment gratuit ?"
free_a = "Oui, pour tous et sans compte. L’application et l’extension sont des logiciels libres (GPL-3.0-or-later) ; les bibliothèques pour développeurs sont sous Apache-2.0, donc tout site ou programme peut les utiliser."
safe_q = "Un site peut-il voir mon PIN, mes clés ou mes autres certificats ?"
safe_a = "Non. Le PIN se saisit dans l’application ou la fenêtre du système, et la clé privée ne quitte jamais votre ordinateur ni votre jeton. Le site ne reçoit que le certificat que vous choisissez et la signature que vous confirmez."
certificates_q = "Quels certificats fonctionnent ?"
certificates_a = "Tout certificat que votre système d’exploitation ou le pilote de votre jeton sait utiliser : jetons USB, cartes à puce et, sous Windows et macOS, certificats installés sur l’ordinateur à partir d’un fichier .pfx ou .p12. Il n’existe pas de liste de modèles agréés."
phone_q = "Est-ce que ça marche sur un téléphone ?"
phone_a = "Non. signlocal fonctionne sur les ordinateurs sous Windows, macOS ou Linux, où l’on branche les jetons et les cartes à puce."
warnings_q = "Pourquoi Windows et macOS affichent-ils un avertissement à l’installation ?"
warnings_a = "Les préversions n’ont pas encore de signature de code. L’installation automatique évite l’avertissement ; la [page d’installation](install) indique où cliquer si vous téléchargez les fichiers vous-même, et comment vérifier l’empreinte de chaque fichier."
background_q = "Quelque chose tourne-t-il en permanence en arrière-plan ?"
background_a = "Non. Le navigateur ne lance l’application que lorsqu’un site demande une signature, et l’application n’ouvre aucun port réseau."
formats_q = "Quels formats de signature sont pris en charge ?"
formats_a = "signlocal renvoie une signature brute et le certificat ; le site construit le format dont il a besoin (PAdES, CAdES, XAdES ou JAdES), selon les règles de n’importe quel pays."
websites_q = "Un site doit-il faire quelque chose de particulier ?"
websites_a = "Oui : le site ajoute la bibliothèque gratuite de signlocal à ses pages. Si un site vous a demandé d’installer signlocal, il l’a déjà fait."

