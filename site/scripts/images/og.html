<!doctype html>
<!-- The social preview (1200 x 630), rendered to public/og.png by render.ts. Only the signlocal
     mark: no browser or system logos (docs: brands/SUMMARY.md). -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Inter"; font-weight: 400 700; src: url("../../src/fonts/inter-subset.woff2") format("woff2"); }
  * { box-sizing: border-box; }
  body { margin: 0; width: 1200px; height: 630px; overflow: hidden; font-family: "Inter", sans-serif; color: #141722;
    background: radial-gradient(900px 520px at 88% -8%, #E3E7FC 0%, #E3E7FC00 62%), linear-gradient(180deg, #F8F9FF 0%, #FFFFFF 78%); }
  main { display: flex; flex-direction: column; justify-content: center; height: 100%; padding: 0 96px; gap: 40px; }
  .brand { display: flex; align-items: center; gap: 20px; font-size: 44px; font-weight: 650; letter-spacing: -0.02em; }
  .brand img { width: 72px; height: 72px; }
  h1 { margin: 0; max-width: 940px; font-size: 80px; line-height: 1.04; font-weight: 700; letter-spacing: -0.03em; }
  h1 span { background: url("../../src/brand/ink-underline.svg") no-repeat 0 92% / 100% 0.32em; padding-bottom: 0.04em; }
  p { margin: 0; font-size: 30px; line-height: 1.4; color: #545C6D; }
</style>
</head>
<body>
<main>
  <div class="brand"><img src="../../src/brand/mark.svg" alt="">signlocal</div>
  <h1>Sign on any website with <span>your own certificate</span>.</h1>
  <p>USB token, smart card or the certificate on your computer. Free and open source.</p>
</main>
</body>
</html>
