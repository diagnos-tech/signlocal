# Single source of truth for every provisional name and identifier.
#
# The final product name depends on a trademark search (INPI, EUIPO, USPTO).
# Renaming the project must only require editing this file: build scripts,
# the extension manifest and the packaging read their identifiers from here.
#
# TODO(gustavo): definir nome, domínio e IDs definitivos após a busca de marca.

[product]
name = "WebeSign"
# Lowercase ASCII: binary names, folders, log files.
slug = "websign"
tagline = "Assine com seu certificado digital em qualquer site."
repository = "https://github.com/diagnos-tech/web-esign"
# TODO(gustavo): subdomínio próprio do GitHub Pages (arquivo CNAME + DNS).
homepage = "https://diagnos-tech.github.io/web-esign/"

[ids]
# Native messaging host name. Chrome only accepts [a-z0-9_.] here.
native_host = "dev.websign.host"
# URL scheme the extension uses to open the app once so it can register
# itself with the browsers (stores run no install scripts).
url_scheme = "websign"
# TODO(gustavo): Team ID da Apple e publisher da Microsoft Store.
macos_bundle_id = "dev.websign.app"
macos_app_group = "TEAMID.dev.websign"
safari_extension_bundle_id = "dev.websign.app.extension"
windows_package_name = "WebeSign"
windows_publisher = "CN=TODO"

[extension]
# Gecko ID: fixed by us, so it is known before publishing to AMO.
firefox_id = "websign@dev.websign"
# Store IDs are assigned on first upload; empty until then.
chrome_web_store_id = ""
edge_addons_id = ""
# Public key of the development build. It pins the unpacked extension ID to
# `dev_id` on every machine, so the native host can allow it before the
# extension is published. The private key is not needed and is not kept.
dev_key = ""
dev_id = "nhnkdpljdgjflbflkhnkmfmcmodboeii"

[npm]
scope = "@websign"
sdk_package = "@websign/sdk"
