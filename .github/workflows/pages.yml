# Publishes site/ to GitHub Pages: the SDK, the extension popup and the app
# link to /download, /test and /activate, so the site must follow the default
# branch (develop).
# The SDK bundle is rebuilt here so the deployed test page always matches
# sdk/src, even if a commit forgot to run site/build-sdk.sh.
# TODO(gustavo): enable Pages with "Source: GitHub Actions" in the repository
# settings; until then the deploy job fails with "Pages not enabled".
name: pages

on:
  push:
    branches: [develop]
    paths:
      - "site/**"
      - "sdk/**"
      - "i18n/**"
      - "project.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# One deployment at a time; a newer push supersedes a queued one but never
# interrupts a deployment in progress.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - name: Install
        timeout-minutes: 10
        run: bun install --frozen-lockfile
      - name: Build the SDK bundle
        run: sh site/build-sdk.sh
      # Only what visitors load: tests, the build script and the folder
      # notes stay out of the published site.
      - name: Stage the site
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          tar -C site --exclude=./tests --exclude=./build-sdk.sh \
            --exclude='*/SUMMARY.md' --exclude=./SUMMARY.md --exclude=./README.md \
            -cf - . | tar -C "$RUNNER_TEMP/site" -xf -
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
