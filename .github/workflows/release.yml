# Release of docs/architecture/packaging-and-release.md §Release workflow:
# a pushed `v*` tag becomes a GitHub prerelease with every artifact of
# §Artifacts, SHA256SUMS, the install scripts and a page rendered from
# packaging/release-notes/template.md (install commands, unsigned-build
# notice, file table with hashes).
#
# Builds run on native runners, except Windows arm64, which MSVC
# cross-compiles on x64. Release builds use no cache, so nothing another ref
# wrote can end up in a published binary. Only the publish job can write.
#
# Re-run for an existing tag with "Run workflow" and the tag name: the page
# and every file are replaced.
#
# TODO(gustavo): code signing (Authenticode, Developer ID + notarization),
# store uploads (Chrome Web Store, Edge Add-ons, AMO, Microsoft Store, Mac App
# Store) and npm publication of @websign/sdk and @websign/desktop are by hand;
# the npm tarballs are attached to the run as the `maintainer-npm` artifact.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and publish, e.g. v0.1.0
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Build dependencies of pcsc-sys and the app's window stack (Ubuntu names).
  LINUX_BUILD_PACKAGES: pkg-config libpcsclite-dev libxkbcommon-dev libwayland-dev
  # packaging/README.md: the nfpm the deb and rpm were verified with; its
  # tarball hashes are pinned in the "Install nfpm" step.
  NFPM_VERSION: 2.43.0

jobs:
  gate:
    name: gate (versions match the tag)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Tag name
        id: version
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::'$TAG' is not vMAJOR.MINOR.PATCH"; exit 1; }
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: Install build dependencies
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ env.LINUX_BUILD_PACKAGES }}
      - name: Install the pinned toolchain
        run: rustup toolchain install || rustup show
      # xtask reads the tag from these variables; a manual run is on a branch
      # ref, so they are set for the command itself.
      - name: Release inputs (versions, licenses, notice, installer identifiers)
        timeout-minutes: 15
        run: GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$TAG" cargo xtask check release

  linux:
    name: app (linux-${{ matrix.arch }})
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, nfpm: x86_64, nfpm_sha256: a80d5f724ed70b192ffa8a2bde469c013cef559c8afa3441eb51dd9a918beb6b }
          - { arch: arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, nfpm: arm64, nfpm_sha256: cfafa3bee852c45a52f2ebbfb063d715235f934d082dc64301a1b9957f3a4032 }
    runs-on: ${{ matrix.os }}
    # Built on the oldest supported distribution, so the binary needs no
    # glibc newer than its 2.34: an Ubuntu 22.04 build already asks for 2.35
    # (hypot), which Rocky Linux 9 lacks.
    container: rockylinux:9
    timeout-minutes: 90
    steps:
      - name: Install build dependencies
        timeout-minutes: 10
        run: >-
          dnf install -y --setopt=install_weak_deps=False
          gcc git tar gzip zip binutils findutils pkgconf-pkg-config
          pcsc-lite-devel libxkbcommon-devel wayland-devel
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: Install rustup and the pinned toolchain
        timeout-minutes: 10
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install
      # The release tarball, checked against the hash pinned in the matrix (a
      # `go install` build reports version "dev", which xtask flags).
      - name: Install nfpm
        timeout-minutes: 10
        run: |
          file="nfpm_${NFPM_VERSION}_Linux_${{ matrix.nfpm }}.tar.gz"
          mkdir -p "$RUNNER_TEMP/nfpm"
          curl -fsSL -o "$RUNNER_TEMP/$file" "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/$file"
          echo "${{ matrix.nfpm_sha256 }}  $RUNNER_TEMP/$file" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP/nfpm" nfpm
          echo "$RUNNER_TEMP/nfpm" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/nfpm/nfpm" --version | grep -F "$NFPM_VERSION"
      - name: Build and package (deb, rpm, tar.gz)
        timeout-minutes: 75
        run: cargo xtask package --target ${{ matrix.target }} --out dist
      - name: Release binary has no e2e marker
        timeout-minutes: 10
        run: cargo xtask check release --binary target/${{ matrix.target }}/release/websign
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: |
            dist/*
            !dist/.stage/**
          if-no-files-found: error
          retention-days: 7

  app:
    name: app (${{ matrix.name }})
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc }
          # Cross-compiled: MSVC on the x64 runner ships the arm64 tools.
          - { name: windows-arm64, os: windows-latest, target: aarch64-pc-windows-msvc }
          - { name: macos-universal, os: macos-latest, target: universal-apple-darwin }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: Install the pinned toolchain
        run: rustup toolchain install || rustup show
      # Default shell: on Windows, PowerShell finds the system bsdtar that
      # xtask uses to write zips, not the GNU tar of Git Bash.
      - name: Build and package
        timeout-minutes: 75
        # Matches LSMinimumSystemVersion in packaging/macos/Info.plist.in.
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: cargo xtask package --target ${{ matrix.target }} --out dist
      - name: Release binaries have no e2e marker
        timeout-minutes: 10
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            universal-apple-darwin) targets="aarch64-apple-darwin x86_64-apple-darwin" ;;
            *) targets="${{ matrix.target }}" ;;
          esac
          for target in $targets; do
            binary="target/$target/release/websign"
            [[ $target == *windows* ]] && binary="$binary.exe"
            cargo xtask check release --binary "$binary"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: |
            dist/*
            !dist/.stage/**
          if-no-files-found: error
          retention-days: 7

  extension:
    name: extension and npm tarballs
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - name: Install
        timeout-minutes: 10
        run: bun install --frozen-lockfile
      # `direct` keeps the development key, so the Chromium ID matches the
      # one the app's native-messaging manifests allow (load unpacked).
      - name: Extension zips (direct channel)
        working-directory: extension
        env:
          WEBSIGN_CHANNEL: direct
        run: bun run zip
      - name: Install build dependencies
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ env.LINUX_BUILD_PACKAGES }}
      - name: Install the pinned toolchain
        run: rustup toolchain install || rustup show
      - name: Release names
        timeout-minutes: 15
        run: cargo xtask package --target x86_64-unknown-linux-gnu --format extension --out dist
      - name: npm tarballs (packed, not published)
        run: |
          mkdir -p npm
          for package in sdk clients/node; do
            (cd "$package" && bun run build && npm pack --pack-destination "$GITHUB_WORKSPACE/npm")
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-extension
          path: |
            dist/*
            !dist/.stage/**
          if-no-files-found: error
          retention-days: 7
      # For the maintainer only: npm packages, the Safari and Edge builds and
      # the Firefox sources zip AMO asks for. None is a release file.
      - uses: actions/upload-artifact@v4
        with:
          name: maintainer-npm
          path: |
            npm/*.tgz
            extension/.output/*.zip
          if-no-files-found: error
          # `.output` is a dot folder, which upload-artifact skips by default.
          include-hidden-files: true
          retention-days: 30

  publish:
    name: publish prerelease
    needs: [gate, linux, app, extension]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Every artifact of the release table is present
        run: |
          v=$VERSION
          expected="websign-$v-windows-x64.zip websign-$v-windows-arm64.zip websign-$v-macos-universal.zip
            websign_${v}_amd64.deb websign_${v}_arm64.deb websign-$v-1.x86_64.rpm websign-$v-1.aarch64.rpm
            websign-$v-linux-x64.tar.gz websign-$v-linux-arm64.tar.gz
            websign-extension-$v-chromium.zip websign-extension-$v-firefox.zip"
          missing=0
          for file in $expected; do
            [[ -f dist/$file ]] || { echo "::error::missing $file"; missing=1; }
          done
          ls -l dist
          exit "$missing"
      - name: Install the pinned toolchain
        run: rustup toolchain install || rustup show
      - name: SHA256SUMS (adds install.sh and install.ps1)
        timeout-minutes: 10
        run: |
          cargo xtask package --sums-only --out dist
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Release page
        run: |
          sh packaging/release-notes/render.sh "$VERSION" dist/SHA256SUMS "$GH_REPO" > notes.md
          {
            echo
            echo "## Changes"
            echo
            gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$TAG" --jq .body
          } >> notes.md
      # Prerelease while the builds are unsigned: `releases/latest` skips it
      # and every install command names the tag. A new release is created as
      # a draft and made visible only once every file is uploaded.
      - name: Publish
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --prerelease --notes-file notes.md
          else
            gh release create "$TAG" dist/* --draft --prerelease --verify-tag \
              --title "WebeSign $VERSION" --notes-file notes.md
            gh release edit "$TAG" --draft=false
          fi
