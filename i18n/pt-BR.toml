# Português (Brasil) (pt-BR)
#
# Translation of en.toml, the reference locale: same keys, same placeholders.
# Format and rules: docs/architecture/i18n.md.

[meta]
# The language's own name, shown in language pickers.
language_name = "Português (Brasil)"

[common]
cancel = "Cancelar"
close = "Fechar"
