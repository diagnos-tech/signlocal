[errors.certificate_not_valid]
title = "Zertifikat außerhalb der Gültigkeit"
body = "Dieses Zertifikat ist abgelaufen oder noch nicht gültig. Wählen Sie ein anderes oder erneuern Sie es bei Ihrem Zertifizierungsdiensteanbieter."

[errors.unsupported_algorithm]
title = "Dieses Zertifikat kann so nicht signieren"
# {algorithm} is a technical name such as RSASSA-PSS; do not translate it.
body = "Die Website hat {algorithm} angefordert, das dieses Zertifikat oder dieser Treiber nicht unterstützt. Wählen Sie ein anderes Zertifikat."

[errors.pin_locked]
title = "PIN gesperrt"
body = "Die PIN Ihres Tokens ist gesperrt. Entsperren Sie sie mit der PUK und versuchen Sie es erneut."

[errors.token_removed]
title = "Der Token wurde entfernt"
body = "Stecken Sie den Token wieder an und klicken Sie auf Erneut versuchen."

[errors.driver_failure]
title = "Der Token-Treiber ist fehlgeschlagen"
# {driver} is the driver or key store name.
body = "{driver} hat nicht wie erwartet geantwortet. Versuchen Sie es erneut; wenn das Problem bestehen bleibt, stecken Sie den Token neu an."

[errors.internal]
title = "In WebeSign ist ein Fehler aufgetreten"
body = "Kopieren Sie die Details und öffnen Sie die Diagnose, um den Fehler zu melden."

# Texts a website may show for SDK errors (exported by @websign/sdk/messages).
[site.errors.extension_missing]
title = "WebeSign-Erweiterung installieren"
body = "Um in diesem Browser zu signieren, installieren Sie die kostenlose Erweiterung."

[site.errors.app_missing]
title = "WebeSign-App installieren"
body = "Zum Signieren benötigt die Erweiterung die App auf Ihrem Computer."

[site.errors.app_outdated]
title = "WebeSign-App aktualisieren"
body = "Sie haben Version {installed}; erforderlich ist {required} oder neuer."

[site.errors.extension_outdated]
title = "WebeSign-Erweiterung aktualisieren"
body = "Starten Sie Ihren Browser neu, damit er aktualisiert."

[site.errors.insecure_origin]
title = "Unsichere Website"
body = "Diese Website verwendet kein https. Zu Ihrer Sicherheit signiert WebeSign nicht für sie."

[site.errors.aborted]
title = "Signatur abgebrochen"
body = "Die Signatur wurde vor dem Abschluss abgebrochen."

[site.errors.user_cancelled]
title = "Signatur abgebrochen"
body = "Sie haben die Signatur abgebrochen."

[site.errors.timeout]
title = "Die Anfrage hat zu lange gedauert"
body = "Sie wurde angehalten, weil niemand rechtzeitig geantwortet hat oder das Dokument zu lange zur Vorbereitung brauchte. Versuchen Sie es erneut."

[site.errors.no_certificates]
title = "Keine Zertifikate gefunden"
body = "Stecken Sie Ihren Token an oder legen Sie Ihre Chipkarte ein und versuchen Sie es erneut."

[site.errors.certificate_unavailable]
title = "Zertifikat nicht verfügbar"
body = "Das gewählte Zertifikat ist nicht mehr verfügbar. Stecken Sie den Token wieder an oder wählen Sie ein anderes."

[site.errors.certificate_not_valid]
title = "Zertifikat außerhalb der Gültigkeit"
body = "Dieses Zertifikat ist abgelaufen oder noch nicht gültig. Wählen Sie ein anderes oder erneuern Sie es bei Ihrem Zertifizierungsdiensteanbieter."

[site.errors.unsupported_algorithm]
title = "Dieses Zertifikat kann so nicht signieren"
body = "Wählen Sie ein anderes Zertifikat."

[site.errors.pin_locked]
title = "PIN gesperrt"
body = "Die PIN Ihres Tokens ist gesperrt. Entsperren Sie sie mit der PUK und versuchen Sie es erneut."

[site.errors.token_removed]
title = "Der Token wurde entfernt"
body = "Stecken Sie den Token wieder an und versuchen Sie es erneut."

[site.errors.driver_failure]
title = "Der Token-Treiber ist fehlgeschlagen"
body = "Versuchen Sie es erneut; wenn das Problem bestehen bleibt, stecken Sie den Token neu an."

[site.errors.busy]
title = "Anfragen warten auf Bestätigung"
body = "Schließen Sie die offenen Anfragen im WebeSign-Fenster ab."

[site.errors.internal]
title = "In WebeSign ist ein Fehler aufgetreten"
body = "Öffnen Sie die WebeSign-Diagnose, um das Problem zu melden."
