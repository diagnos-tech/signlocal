# Store listing (Chrome Web Store, Edge Add-ons, AMO, Opera add-ons).
listing_name = "WebeSign: mit Ihrem Zertifikat signieren"
listing_summary = "Signieren Sie auf jeder Website mit Smartcard, USB-Token oder Systemzertifikat. Windows, macOS und Linux. Frei und Open Source."
listing_description = """
Signieren Sie auf jeder Website mit Ihrer Smartcard, Ihrem USB-Token oder einem Zertifikat Ihres Betriebssystems. Funktioniert mit Chrome, Edge, Firefox, Opera, Brave und Safari unter Windows, macOS und Linux. Frei und Open Source für alle.

Wenn eine Website eine Signatur anfordert, öffnet die WebeSign-App ein eigenes Fenster auf Ihrem Computer: Sie sehen, wer anfragt, wählen Ihr Zertifikat, prüfen den Prüfcode und bestätigen. Die PIN geben Sie in der App oder im Fenster des Betriebssystems ein, nie auf einer Webseite.

• Funktioniert mit den Zertifikaten, die Sie schon haben: USB-Tokens, Smartcards und auf dem Computer installierte Zertifikate.
• Die Website sendet nur einen Fingerabdruck (Hash) des Dokuments; das Dokument selbst verlässt sie nie.
• Jede Signatur braucht Ihre Bestätigung, und jede Website Ihre Erlaubnis, die Sie jederzeit widerrufen können.
• Kein Konto, keine Tracker, kein Hintergrunddienst und kein offener Netzwerkport.

Die Erweiterung arbeitet mit der kostenlosen WebeSign-App für Windows, macOS und Linux zusammen, erhältlich auf der Projektwebsite. Quellcode: GPL-3.0-or-later; Entwicklerbibliotheken: Apache-2.0."""

[extension]
# Extension name in browser stores; keep the product name.
name = "WebeSign"
# One-line description in browser stores (at most 132 characters).
description = "Signieren Sie auf jeder Website mit Chipkarte, USB-Token oder Zertifikat des Betriebssystems. Kostenlos und Open Source für alle."

