title = "Certificato non disponibile"
body = "Il certificato scelto non è più disponibile. Ricollega il token o scegline un altro."

[site.errors.certificate_not_valid]
title = "Certificato non in corso di validità"
body = "Questo certificato è scaduto o non è ancora valido. Scegline un altro o rinnovalo presso la tua autorità di certificazione."

[site.errors.unsupported_algorithm]
title = "Questo certificato non può firmare in questo modo"
body = "Scegli un altro certificato."

[site.errors.pin_locked]
title = "PIN bloccato"
body = "Il PIN del token è bloccato. Sbloccalo con il PUK e riprova."

[site.errors.token_removed]
title = "Il token è stato rimosso"
body = "Ricollega il token e riprova."

[site.errors.driver_failure]
title = "Il driver del token ha avuto un errore"
body = "Riprova; se il problema persiste, ricollega il token."

[site.errors.busy]
title = "Ci sono richieste in attesa di conferma"
body = "Completa le richieste aperte nella finestra di WebeSign."

[site.errors.internal]
title = "Si è verificato un problema in WebeSign"
body = "Apri la diagnostica di WebeSign per segnalare il problema."
