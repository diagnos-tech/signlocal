[site.errors.no_certificates]
title = "No se encontró ningún certificado"
body = "Conecte el token o inserte la tarjeta e inténtelo de nuevo."

[site.errors.certificate_unavailable]
title = "Certificado no disponible"
body = "El certificado elegido ya no está disponible. Vuelva a conectar el token o elija otro."

[site.errors.certificate_not_valid]
title = "Certificado fuera de validez"
body = "Este certificado ha caducado o aún no es válido. Elija otro o renuévelo con su autoridad de certificación."

[site.errors.unsupported_algorithm]
title = "Este certificado no puede firmar así"
body = "Elija otro certificado."

[site.errors.pin_locked]
title = "PIN bloqueado"
body = "El PIN de su token está bloqueado. Desbloquéelo con el PUK e inténtelo de nuevo."

[site.errors.token_removed]
title = "Se retiró el token"
body = "Vuelva a conectar el token e inténtelo de nuevo."

[site.errors.driver_failure]
title = "Falló el controlador del token"
body = "Inténtelo de nuevo; si continúa, vuelva a conectar el token."

[site.errors.busy]
title = "Hay solicitudes esperando confirmación"
body = "Termine las solicitudes abiertas en la ventana de WebeSign."

[site.errors.internal]
title = "Algo salió mal en WebeSign"
body = "Abra el diagnóstico de WebeSign para informar del problema."
