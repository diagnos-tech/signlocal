[extension]
# Extension name in browser stores; keep the product name.
name = "WebeSign"
# One-line description in browser stores (at most 132 characters).
description = "Sign on any website with your digital certificate: USB token, smart card or a certificate installed on your computer."

# Window texts for errors (docs/ux.md §15). `title` is bold, `body` below it.
[errors.insecure_origin]
title = "Insecure site"
body = "This site doesn't use https. For your safety, WebeSign won't sign for it."

[errors.timeout]
title = "The request expired"
body = "Nobody answered for 5 minutes. Go back to the site and try again."

[errors.no_certificates]
title = "No certificates found"
body = "Plug in your token or insert your card and try again."

[errors.certificate_unavailable]
title = "Certificate unavailable"
body = "The chosen certificate is no longer available. Plug the token back in or choose another one."

[errors.certificate_not_valid]
title = "Certificate out of validity"
body = "This certificate has expired or isn't valid yet. Choose another one or renew it with your certificate authority."

[errors.unsupported_algorithm]
title = "This certificate can't sign that way"
# {algorithm} is a technical name such as RSASSA-PSS; do not translate it.
body = "The site asked for {algorithm}, which this certificate or driver doesn't support. Choose another certificate."

[errors.pin_locked]
title = "PIN locked"
body = "Your token PIN is locked. Unlock it with the PUK and try again."

[errors.token_removed]
title = "The token was removed"
body = "Plug the token back in and click Try again."

[errors.driver_failure]
title = "The token driver failed"
# {driver} is the driver or key store name.
body = "{driver} didn't respond as expected. Try again; if it keeps happening, reconnect the token."

[errors.internal]
title = "Something went wrong in WebeSign"
body = "Copy the details and open diagnostics to report it."

