via_browser = "via {browser}"
# Next to the eyebrow when a desktop program asks instead of a website.
via_app = "depuis un programme sur cet ordinateur"
asks_sign = "souhaite que vous signiez un document."
asks_select = "souhaite savoir avec quel certificat vous allez signer."
site_remembered = "Site autorisé"
site_new = "Nouveau site"
