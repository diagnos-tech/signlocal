# XcodeGen spec for the Mac App Store build: the WebeSign.app bundle (the Rust
# `websign` binary as its executable) and the Safari web extension appex.
# Generate with `xcodegen generate --spec safari/project.yml`.
# Built only for the store channel (docs/plan.md D10); direct builds ship
# no Safari extension.
name: WebeSign
options:
  bundleIdPrefix: dev.websign
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    # TODO(gustavo): Apple Team ID.
    DEVELOPMENT_TEAM: TEAMID
    MARKETING_VERSION: "0.1.0"
targets:
  WebeSign:
    type: application
    platform: macOS
    sources: [App]
    info:
      path: App/Info.plist
    entitlements:
      path: App/WebeSign.entitlements
    dependencies:
      - target: WebeSignExtension
    # The Rust binary replaces the app executable in a post-build step
    # (packaging/macos/store).
  WebeSignExtension:
    type: app-extension
    platform: macOS
    sources: [Extension]
    info:
      path: Extension/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    entitlements:
      path: Extension/WebeSignExtension.entitlements
