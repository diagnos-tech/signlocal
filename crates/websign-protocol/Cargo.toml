[package]
name = "websign-protocol"
description = "The WebeSign wire contract: message types for native messaging and `websign connect`, framing, error codes and the verification code. Apache-2.0 so client libraries can depend on it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The contract is shared with the Apache-2.0 SDK and client libraries.
license = "Apache-2.0"
repository.workspace = true
publish.workspace = true

[features]
# Derives ts-rs bindings; `cargo xtask gen` enables it to write the
# TypeScript types into sdk/, extension/ and clients/node/.
typescript = ["dep:ts-rs"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ts-rs = { workspace = true, optional = true }

[lints]
workspace = true
