[package]
name = "signlocal-app"
description = "The signlocal desktop app: one binary that is the browsers' native messaging host, the desktop API (`signlocal connect`, `sign`, `choose`), the installer (`install`, `register`) and the confirmation and diagnostics windows."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "signlocal"
path = "src/main.rs"

[features]
# Test builds only (never in releases; CI checks the release binary): the
# confirmation window confirms by itself once armed and saves a PNG of every
# state it shows. See docs/architecture/testing.md.
e2e = ["dep:png", "signlocal-host/e2e"]

[dependencies]
signlocal-core.workspace = true
signlocal-protocol.workspace = true
signlocal-project.workspace = true
signlocal-i18n.workspace = true
signlocal-keystores.workspace = true
signlocal-devices.workspace = true
signlocal-host.workspace = true
signlocal-registration.workspace = true
signlocal-ui-model.workspace = true
thiserror.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
secrecy.workspace = true
zeroize.workspace = true
jiff.workspace = true
eframe.workspace = true
egui.workspace = true
# `subset`: embed only the icons `src/ui/icons.rs` names (docs/ux.md §12).
egui-phosphor = { workspace = true, features = ["subset"] }
# `e2e` builds only: the window screenshots (same version egui_kittest uses).
png = { version = "=0.18.1", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Security_WinTrust",
  "Win32_Security_Cryptography",
  "Win32_Security_Cryptography_Catalog",
  "Win32_Security_Cryptography_Sip",
  "Win32_Security_Cryptography_UI",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_System_Com",
  "Win32_System_SystemInformation",
  "Wdk_System_SystemServices",
  "Win32_Storage_FileSystem",
] }

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true
security-framework.workspace = true
core-foundation.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
tempfile.workspace = true
# The SoftHSM2 test drives `signlocal connect` through the real client.
signlocal-client = { path = "../clients/rust", version = "0.1.0" }

[lints]
workspace = true
