# cargo-deny policy. The app is GPL-3.0-or-later with an app-store additional
# permission (see LICENSE), so every dependency must be GPL-3.0-compatible;
# the client crate and the protocol crate are Apache-2.0, which the same list
# satisfies. Run with `cargo deny check`.

[graph]
all-features = true
exclude-dev = false

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Marvin: timing side channel in RSA *decryption and signing* with a private
  # key, no fixed release yet. `rsa` is used only by websign-core's verifier
  # (src/verify/rsa_verify.rs) with public keys from certificates; signing
  # happens inside the token or OS key store, never with this crate.
  { id = "RUSTSEC-2023-0071", reason = "rsa is used for public-key signature verification only; no private-key operations" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "BSL-1.0",
  "OFL-1.1",
  "GPL-3.0-or-later",
  "CDLA-Permissive-2.0",
]
# egui's bundled default fonts include Ubuntu-Light, whose font licence
# allows redistributing the font with software; it is font data, not code,
# and only this crate carries it.
exceptions = [
  { crate = "epaint_default_fonts", allow = ["Ubuntu-font-1.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Nothing in the product may pull in OpenSSL or a TLS stack: the app does not
# use the network.
deny = [
  { crate = "openssl-sys" },
  { crate = "native-tls" },
  { crate = "reqwest" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
