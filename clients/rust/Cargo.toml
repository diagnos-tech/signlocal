[package]
name = "websign-client"
description = "Call the SignLocal app from any Rust program: choose a certificate and sign a digest through `websign connect`, with the same flow as the web SDK."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
# Publishing is a release decision; websign-protocol and websign-project must
# be published first (both are self-contained).
publish.workspace = true
keywords = ["signature", "pkcs11", "smartcard", "pades", "icp-brasil"]
categories = ["cryptography", "api-bindings"]
readme = "README.md"
documentation = "https://docs.rs/websign-client"
# Only what a consumer needs: no tests, no fixtures of the misbehaving fake app.
exclude = ["/tests", "/examples", "/SPEC.md", "/SUMMARY.md", "**/SUMMARY.md"]

[features]
# `websign_client::testing::FakeApp`: an in-process stand-in for the app, so
# tests of your program need neither the app nor a person. Off by default.
testing = []

[package.metadata.docs.rs]
# The fake is part of the documented surface.
all-features = true
# Linux is enough: the crate's API is identical on every OS.
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
websign-protocol.workspace = true
websign-project.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The fake app in `examples/` builds its JSON by hand.
serde_json.workspace = true

[lints]
workspace = true
