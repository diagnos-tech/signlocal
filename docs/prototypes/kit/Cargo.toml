# Risk-proof kit: throwaway-quality code is not allowed here either, because
# the parts that survive (probe-core, keystore adapters) seed the real app.
[workspace]
resolver = "3"
members = ["probe-core", "probe"]

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
probe-core = { path = "probe-core" }
thiserror = "2"
sha2 = "0.11"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
